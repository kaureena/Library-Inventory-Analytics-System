name: ETL Smoke Test

on:
  push:
  pull_request:

jobs:
  etl-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r v2_analytics_modernisation/requirements.txt
      - name: Run pipeline end-to-end
        run: |
          cd v2_analytics_modernisation
          python scripts/make_sample_data.py
          python etl/run_etl.py
          python scripts/generate_bi_exports.py
      - name: Check exports exist
        run: |
          ls -1 v2_analytics_modernisation/bi_powerbi/exports | head
