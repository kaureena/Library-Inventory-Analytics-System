name: Run Tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r v2_analytics_modernisation/requirements.txt
          pip install -r v1_bca_basic_system/requirements.txt
          pip install pytest
      - name: Run tests
        run: |
          pytest -q
